name: Build & Publish Multi-Arch Image

# 链路：push 到 GitHub → 本工作流用 buildx 构建 amd64 + arm64 双架构
# → 以同一个 tag 推送到 Docker Hub（manifest list）→ 各设备直接 pull。
#
# 为什么必须多架构：GitHub 托管 runner 是 x86/amd64，如果只做普通
# docker build，推上去的就是单架构镜像，arm64 设备拉下来会 exec format error。

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: tt-music

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 本仓库 Dockerfile 是纯 COPY、无 RUN，多平台构建时并不需要在目标架构上
      # 执行任何指令；保留 QEMU 是为了将来若新增 RUN 仍能正常跨平台构建。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 关掉 provenance，避免旧版 Docker/containerd 看到 unknown/unknown 平台条目
          provenance: false

      - name: Verify published manifest
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n 1)"
          echo "Inspecting $IMAGE"
          docker buildx imagetools inspect "$IMAGE"
